name: starter

# Builds the game's own models (art/src at the repository root) on a GitHub
# machine with framework/scripts/build-starter.sh and keeps their previews as
# an artifact. Its engine (the root engine package) compiles into target/.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build
        required: true

permissions:
  contents: read

jobs:
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: starter-${{ hashFiles('Cargo.lock') }}
      - name: Tools
        run: |
          command -v rg > /dev/null || sudo apt-get install -y -qq ripgrep
      - name: Build
        run: framework/scripts/build-starter.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starter-previews
          path: |
            art/models/**/preview.png
            art/models/**/views.png
            art/models/**/turntable/*.png
          if-no-files-found: ignore
