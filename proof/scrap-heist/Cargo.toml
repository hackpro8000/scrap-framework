# Scrap Heist's engine: the framework's host (framework/engine) with this
# game's style plugins (art/plugins), listed in engine/src/main.rs. Built with
#   cargo build --release --manifest-path proof/scrap-heist/Cargo.toml -p engine
# into target/release/modelkit.
[workspace]
members = ["engine", "art/plugins/*"]
resolver = "2"

[workspace.dependencies]
png = "0.17"
bytemuck = { version = "1.25", features = ["derive"] }

# Profiles apply only from the workspace being built: the same as
# framework/engine/Cargo.toml's.
# Dependencies (Luau's C++ included) build optimized once; our own code stays
# quick to rebuild but still fast enough to bake textures.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
# One optimisation pass over the whole engine instead of one per unit: a
# slower compile, paid once per engine change, for a faster bake.
lto = "thin"
codegen-units = 1
