[package]
name = "modelkit"
version = "0.1.0"
edition = "2021"

# The engine is a small kernel crate plus plugin crates under crates/, with
# this package (the modelkit binary) at the root. proof-base is an old engine
# copied in for a bake proof (scripts/bake-proof.sh); it builds on its own.
[workspace]
members = [".", "crates/*"]
exclude = ["proof-base"]
resolver = "2"

[workspace.dependencies]
png = "0.17"
bytemuck = { version = "1.25", features = ["derive"] }

[dependencies]
modelkit-kernel = { path = "crates/kernel" }
modelkit-anim = { path = "crates/anim" }
modelkit-render = { path = "crates/render" }
modelkit-cache = { path = "crates/cache" }
modelkit-texels = { path = "crates/texels" }
sh-paint = { path = "crates/sh-paint" }
sh-shading = { path = "crates/sh-shading" }
mlua = { version = "0.12", features = ["luau", "luau-jit"] }

# Dependencies (Luau's C++ included) build optimized once; our own code stays
# quick to rebuild but still fast enough to bake textures.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
# One optimisation pass over the whole engine instead of one per unit: a
# slower compile, paid once per engine change, for a faster bake.
lto = "thin"
codegen-units = 1
